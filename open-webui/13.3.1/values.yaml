  apiVersion: gateway.networking.k8s.io/v1

  # -- Set the route kind
  # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
  kind: HTTPRoute

  # -- Annotations to add to the route
  annotations: {}
  # -- Labels to add to the route
  labels: {}

  # -- Hostnames to match for the route
  hostnames: []
  # - "open-webui.example.com"

  # -- References to the parent resources (e.g. Gateway)
  parentRefs: []
  # - name: open-webui-gw

  # -- Enables HTTPS redirect for the route
  httpsRedirect: false

  # -- Configuration for the HTTP-to-HTTPS redirect route (only used when httpsRedirect is true)
  # If redirect.parentRefs is set, it will be used as-is for the redirect route's parentRefs.
  # Otherwise, the main route's parentRefs are used with sectionName defaulting to "http".
  redirect: {}
  # parentRefs:
  #   - name: my-gateway
  #     sectionName: http

  matches:
    - path:
        # -- Path match type. Note that custom path prefix is not supported in Open WebUI, so any non-default value will break. See https://github.com/open-webui/open-webui/discussions/3431
