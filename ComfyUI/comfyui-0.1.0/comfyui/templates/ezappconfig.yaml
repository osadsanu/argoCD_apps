apiVersion: ezconfig.hpe.ezaf.com/v1alpha1
kind: EzAppConfig
metadata:
  name: ezappconfig-{{ .Chart.Name }}-app
  annotations:
    hpe-ezua/cleanup-chart-on-delete: "false"
    hpe-ezua/minimal-cpu-request: '4'
    hpe-ezua/minimal-mem-request: 1G
    hpe-ezua/minimal-cpu-per-node-request: 4000m
    hpe-ezua/minimal-mem-per-node-request: 1G
    hpe-ezua/minimal-nodes-request: '1'
    hpe-ezua/minimal-request-skip-validation: 'false'
  labels:
    hpe-ezua/imported-app: "true"
spec:
  backoffLimit: 3
  category: dataEngineering
  chartVersion: {{ .Values.chartVersion }}
  description: ComfyUI diffusion model GUI deployed as a PCAI framework
  install: true
  label: ComfyUI
  name: {{ .Chart.Name }}
  options:
    create-namespace: "true"
    namespace: {{ .Release.Namespace }}
    timeout: 45m
    wait: "true"
    debug: "true"
  values: |
    ezua:
      virtualService:
        endpoint: {{ .Values.ezua.virtualService.endpoint }}
        istioGateway: {{ .Values.ezua.virtualService.istioGateway }}
    clusterDomain: {{ .Values.clusterDomain }}
    replicaCount: {{ .Values.replicaCount }}
    nameOverride: {{ .Values.nameOverride | quote }}
    fullnameOverride: {{ .Values.fullnameOverride | quote }}
    image:
      repository: {{ .Values.image.repository }}
      pullPolicy: {{ .Values.image.pullPolicy }}
      tag: {{ .Values.image.tag | quote }}
    service:
      type: {{ .Values.service.type }}
      port: {{ .Values.service.port }}
      containerPort: {{ .Values.service.containerPort }}
    ingress:
      enabled: {{ .Values.ingress.enabled }}
    autoscaling:
      enabled: {{ .Values.autoscaling.enabled }}
      minReplicas: {{ .Values.autoscaling.minReplicas }}
      maxReplicas: {{ .Values.autoscaling.maxReplicas }}
      targetCPUUtilizationPercentage: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    env:
{{ .Values.env | toYaml | indent 6 }}
    resources:
{{ .Values.resources | toYaml | indent 6 }}
  version: ""
  logoImage: >-
    {{ .Values.logoImage }}
